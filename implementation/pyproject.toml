[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tasting-event-foundation"
version = "0.1.0"
description = "Django foundation for the tasting event application"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2.19,<5.3",
    "dj-database-url>=2.3,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tasting_project*"]
